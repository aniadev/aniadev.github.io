name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages, and serialize deploys.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # pnpm 11 in CI aborts (ERR_PNPM_IGNORED_BUILDS) on pending native build scripts, and its
      # onlyBuiltDependencies allowlist is not honored on this version — node_modules is fully
      # populated regardless, so tolerate the exit code and compile the one native dep next.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile || true

      # Nuxt Content needs the better-sqlite3 native binding at build time.
      - name: Compile better-sqlite3
        run: |
          PKG="$(node -e "console.log(require('path').dirname(require.resolve('better-sqlite3/package.json')))")"
          echo "Building native module in: $PKG"
          ( cd "$PKG" && npm run build-release )

      # Call the nuxt binary directly so pnpm's verify-deps-before-run can't fire an implicit
      # (and failing) reinstall before the build.
      - name: Build static site
        run: ./node_modules/.bin/nuxt generate
        env:
          NITRO_PRESET: github_pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
